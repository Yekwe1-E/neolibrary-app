<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — NeoLibrary</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .profile-avatar-wrap {
      position: relative; width: 96px; height: 96px;
    }
    .profile-avatar {
      width: 96px; height: 96px; border-radius: 50%;
      border: 3px solid var(--clr-primary); object-fit: cover;
    }
    .role-chip {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.3rem 0.875rem; border-radius: var(--radius-full);
      background: var(--clr-primary-subtle); border: 1px solid hsla(239,84%,67%,0.25);
      color: var(--clr-primary-bright); font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
  </style>
</head>
<body class="app-layout">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <header class="topbar"></header>

    <div class="app-content animate-fade-in" style="max-width: 800px;">

      <div class="page-title">
        <h1>My Profile</h1>
        <p>Manage your library card details and account information.</p>
      </div>

      <!-- Profile Card -->
      <div class="dash-section" style="margin-bottom:1.5rem;">
        <div style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--clr-border);">
          <div class="profile-avatar-wrap">
            <img id="profile-pic" src="" alt="Avatar" class="profile-avatar">
          </div>
          <div>
            <h2 id="profile-name" style="font-size:1.375rem;margin-bottom:0.375rem;"></h2>
            <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;margin-bottom:0.5rem;">
              <span class="role-chip" id="profile-role-chip">
                <i class="ph ph-user-circle"></i>
                <span id="profile-role-text"></span>
              </span>
              <span id="profile-status-chip" class="badge badge-success"></span>
            </div>
            <p id="profile-date" class="text-muted text-sm"></p>
          </div>
        </div>

        <form id="profile-form">
          <div class="form-group">
            <label for="form-name">Full Name</label>
            <div class="input-group">
              <i class="ph ph-user input-icon"></i>
              <input type="text" id="form-name" class="form-control" required placeholder="John Doe">
            </div>
          </div>

          <div class="form-group">
            <label for="form-email">Email Address
              <span style="color:var(--clr-text-faint);font-size:0.75rem;font-weight:400;"> (Cannot be changed)</span>
            </label>
            <div class="input-group">
              <i class="ph ph-envelope input-icon"></i>
              <input type="email" id="form-email" class="form-control" disabled readonly>
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label for="form-phone">Phone Number</label>
              <div class="input-group">
                <i class="ph ph-phone input-icon"></i>
                <input type="text" id="form-phone" class="form-control" placeholder="+234 800 000 0000">
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="form-address">Mailing Address</label>
            <textarea id="form-address" class="form-control" rows="3" placeholder="No. 1 Library Road…"></textarea>
          </div>

          <div style="display:flex;gap:0.75rem;margin-top:0.5rem;">
            <button type="submit" class="btn btn-primary" id="save-profile-btn">
              <i class="ph ph-floppy-disk"></i> Save Changes
            </button>
          </div>
        </form>
      </div>

      <!-- Danger Zone -->
      <div class="dash-section" style="border-color:var(--clr-danger);">
        <h3 style="color:var(--clr-danger);margin-bottom:0.5rem;">Account Actions</h3>
        <p class="text-muted text-sm" style="margin-bottom:1.5rem;">Manage your session and account security.</p>
        <button class="btn btn-danger btn-sm" onclick="window.Auth.logout()">
          <i class="ph ph-sign-out"></i> Sign Out of Account
        </button>
      </div>

    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/nav.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      window.Auth.requireAuth();
      const user = window.Auth.getUser();

      window.NavComponent.init({ activePage: 'profile', pageTitle: 'My Profile' });

      const setUI = (data) => {
        const avatarUrl = data.avatar_url || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(data.full_name)}&backgroundColor=6366f1&textColor=ffffff`;
        document.getElementById('profile-pic').src           = avatarUrl;
        document.getElementById('profile-name').textContent  = data.full_name;
        document.getElementById('profile-role-text').textContent = data.role;
        document.getElementById('profile-status-chip').textContent = data.status;
        document.getElementById('profile-status-chip').className   = `badge ${data.status === 'active' ? 'badge-success' : 'badge-danger'}`;
        document.getElementById('profile-date').textContent  = 'Card since: ' + window.formatDate(data.membership_date);

        document.getElementById('form-name').value    = data.full_name;
        document.getElementById('form-email').value   = data.email;
        document.getElementById('form-phone').value   = data.phone   || '';
        document.getElementById('form-address').value = data.address || '';
      };

      setUI(user);

      document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('save-profile-btn');
        const full_name = document.getElementById('form-name').value.trim();
        const phone     = document.getElementById('form-phone').value.trim();
        const address   = document.getElementById('form-address').value.trim();
        const avatar_url = `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(full_name)}&backgroundColor=6366f1&textColor=ffffff`;

        try {
          btn.disabled  = true;
          btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Saving…';

          const res = await window.api.put('/auth/me', { full_name, phone, address, avatar_url });
          if (res.status === 'success') {
            window.showToast("Profile updated successfully!", "success");
            window.Auth.setSession(window.Auth.getToken(), res.data);
            setUI(res.data);
          }
        } catch (err) {
          window.showToast(err.message, "error");
        } finally {
          btn.disabled  = false;
          btn.innerHTML = '<i class="ph ph-floppy-disk"></i> Save Changes';
        }
      });
    });
  </script>
</body>
</html>
